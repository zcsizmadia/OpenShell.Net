# CodeQL analyses the code we write, tests included. Compiler-generated sources (source generators write them under
# obj/) and the documentation snippets (illustrative fragments, compiled separately) are left out. For the traced C#
# build paths-ignore has no effect, so codeql.yml also drops results in obj/ before uploading.
name: OpenShell.Net

queries:
  - uses: security-and-quality

paths-ignore:
  - "**/obj/**"
  - docs/snippets
