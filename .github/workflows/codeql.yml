name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # C# is built by the repository script so the analysis sees the same build as CI.
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build
        if: matrix.build-mode == 'manual'
        run: scripts/ci.sh build

      # A traced C# build extracts the compiler-generated sources too (source generators, under obj/), and paths-ignore
      # does not apply to traced extraction. So the C# results are written to a file, generated sources are dropped,
      # and the filtered file is uploaded.
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ matrix.build-mode == 'manual' && 'never' || 'always' }}
          output: sarif-results

      - name: Drop results in generated sources
        if: matrix.build-mode == 'manual'
        run: |
          for file in sarif-results/*.sarif; do
            jq '.runs[].results |= map(select(
                  ([.locations[]?.physicalLocation.artifactLocation.uri // ""] | any(test("(^|/)obj/"))) | not))' \
              "$file" > "$file.filtered"
            echo "$(basename "$file"): $(jq '[.runs[].results[]] | length' "$file") results, $(jq '[.runs[].results[]] | length' "$file.filtered") outside generated sources"
            mv "$file.filtered" "$file"
          done

      - name: Upload results
        if: matrix.build-mode == 'manual'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif-results
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
